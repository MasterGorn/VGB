<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mot de passe oublié — Video Games Battle</title>
<link rel="stylesheet" href="/css/header.css" />
<link rel="stylesheet" href="/css/common.css" />
<link rel="stylesheet" href="/css/global.css" />
<style>
  .container { max-width: 420px; margin: 0 auto; padding: 120px 16px 40px; }
  h1 { font-size: clamp(22px, 5vw, 28px); margin: 0 0 16px; color: #ffd700; }
  .card {
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 20px;
    background: rgba(255,255,255,0.04);
  }
  .row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  label { font-size: 13px; color: rgba(255,255,255,0.75); }
  input {
    font-size: 16px; padding: 12px; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; background: rgba(0,0,0,0.25); color: #fff; min-height: 48px;
  }
  button {
    width: 100%; font-size: 15px; font-weight: bold; padding: 12px 14px;
    border-radius: 8px; border: none; cursor: pointer; min-height: 48px; color: #fff;
    background: linear-gradient(135deg, #e67e22, #f1c40f); color: #111;
  }
  .hint { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 12px; }
  .msg { margin-top: 10px; font-size: 13px; color: #ff8a80; }
  .msg.ok { color: #2ecc71; }
  a { color: #ffd700; }
</style>
</head>
<body>
<div id="header-root"></div>
<main class="container">
  <h1>Mot de passe oublié</h1>
  <div class="card">
    <p class="hint" style="margin-top:0;">Indiquez l’email du compte. Si un compte existe, vous recevrez un lien de réinitialisation.</p>
    <div class="row">
      <label for="email">Email</label>
      <input id="email" type="email" maxlength="120" autocomplete="email" />
    </div>
    <button type="button" id="btn-send">Envoyer le lien</button>
    <p class="msg" id="msg"></p>
    <p class="hint"><a href="/login.html">Retour à la connexion</a></p>
  </div>
</main>
<script src="/js/translations.js"></script>
<script src="/js/header.js"></script>
<script src="/js/online.js"></script>
<script>
VGBHeader.injectHeader('login');
if (typeof initTranslation === 'function') initTranslation();
document.getElementById('btn-send').onclick = async function () {
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = '';
  try {
    const data = await VGBOnline.forgotPassword(document.getElementById('email').value.trim());
    msg.className = 'msg ok';
    msg.textContent = (data && data.message) || 'Si un compte existe, un email a été envoyé.';
  } catch (e) {
    msg.textContent = e.message || 'Erreur';
  }
};
</script>
</body>
</html>
