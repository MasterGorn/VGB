<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nouveau mot de passe — Video Games Battle</title>
<link rel="stylesheet" href="/css/header.css" />
<link rel="stylesheet" href="/css/common.css" />
<link rel="stylesheet" href="/css/global.css" />
<style>
  .container { max-width: 420px; margin: 0 auto; padding: 120px 16px 40px; }
  h1 { font-size: clamp(22px, 5vw, 28px); margin: 0 0 16px; color: #ffd700; }
  .card {
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 20px;
    background: rgba(255,255,255,0.04);
  }
  .row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  label { font-size: 13px; color: rgba(255,255,255,0.75); }
  input {
    font-size: 16px; padding: 12px; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; background: rgba(0,0,0,0.25); color: #fff; min-height: 48px;
  }
  button {
    width: 100%; font-size: 15px; font-weight: bold; padding: 12px 14px;
    border-radius: 8px; border: none; cursor: pointer; min-height: 48px;
    background: linear-gradient(135deg, #2ecc71, #27ae60); color: #fff;
  }
  .hint { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 12px; }
  .msg { margin-top: 10px; font-size: 13px; color: #ff8a80; }
  .msg.ok { color: #2ecc71; }
  a { color: #ffd700; }
</style>
</head>
<body>
<div id="header-root"></div>
<main class="container">
  <h1>Nouveau mot de passe</h1>
  <div class="card">
    <div class="row">
      <label for="password">Nouveau mot de passe</label>
      <input id="password" type="password" maxlength="64" autocomplete="new-password" />
    </div>
    <div class="row">
      <label for="password2">Confirmer</label>
      <input id="password2" type="password" maxlength="64" autocomplete="new-password" />
    </div>
    <button type="button" id="btn-reset">Enregistrer</button>
    <p class="msg" id="msg"></p>
    <p class="hint"><a href="/login.html">Retour à la connexion</a></p>
  </div>
</main>
<script src="/js/translations.js"></script>
<script src="/js/header.js"></script>
<script src="/js/online.js"></script>
<script>
VGBHeader.injectHeader('login');
if (typeof initTranslation === 'function') initTranslation();
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
document.getElementById('btn-reset').onclick = async function () {
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = '';
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  if (!token) {
    msg.textContent = 'Lien invalide : jeton manquant.';
    return;
  }
  if (p1 !== p2) {
    msg.textContent = 'Les mots de passe ne correspondent pas.';
    return;
  }
  try {
    const data = await VGBOnline.resetPassword(token, p1);
    msg.className = 'msg ok';
    msg.textContent = (data && data.message) || 'Mot de passe mis à jour.';
    setTimeout(function () { location.href = '/login.html'; }, 1500);
  } catch (e) {
    msg.textContent = e.message || 'Erreur';
  }
};
</script>
</body>
</html>
